[package]
name = "konomanoasa-tree-sitter-bash"
version = "0.3.0"
edition = "2024"
description = "Tree-sitter grammars for Bash."
readme = "README.md"
repository = "https://github.com/konomanoasa/tree-sitter-bash"
license = "MIT"
build = "bindings/rust/build.rs"
links = "tree-sitter-bash"
include = [
  "/LICENSE",
  "/README.md",
  "/bash_extglob/src/*.c",
  "/bash_extglob/src/*.h",
  "/bash_extglob/src/node-types.json",
  "/bash_extglob/src/tree_sitter/*.h",
  "/bash_extglob_noextquote/src/*.c",
  "/bash_extglob_noextquote/src/*.h",
  "/bash_extglob_noextquote/src/node-types.json",
  "/bash_extglob_noextquote/src/tree_sitter/*.h",
  "/bash_noextquote/src/*.c",
  "/bash_noextquote/src/*.h",
  "/bash_noextquote/src/node-types.json",
  "/bash_noextquote/src/tree_sitter/*.h",
  "/bindings/rust/*.rs",
  "/common/*.h",
  "/queries/*.scm",
  "/src/*.c",
  "/src/*.h",
  "/src/node-types.json",
  "/src/tree_sitter/*.h",
  "/test/bindings.test.rs",
]

[lib]
path = "bindings/rust/lib.rs"

[[test]]
name = "bindings"
path = "test/bindings.test.rs"

[dependencies]
tree-sitter-language = "0.1.8"

[dev-dependencies]
tree-sitter = "0.27.0"

[build-dependencies]
cc = "1.4"
